name: Deploy Dev to GitHub Pages (/test)
 
on:
  workflow_dispatch:
  push:
    branches:
      - dev
 
permissions:
  contents: write
 
concurrency:
  group: deploy-dev
  cancel-in-progress: true
 
jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
 
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
 
      - name: Install dependencies
        run: bun install --frozen-lockfile
 
      - name: Build
        run: bun run build
        env:
          GITHUB_PAGES: "true"
          BASE_URL: "/test"
 
      - name: Deploy to gh-pages /test
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: test
          keep_files: true
